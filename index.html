<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RimaOS</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ============================= -->
    <!-- Desktop -->
    <!-- ============================= -->

    <div id="desktop"></div>



    <!-- ============================= -->
    <!-- Status Bar -->
    <!-- ============================= -->

    <div class="status-bar">

        <p id="time">
            12:45
        </p>

        <p class="icon">
            &#xE701;
        </p>

        <p class="icon">
            &#xE995;
        </p>

        <p class="icon">
            &#xE850;
        </p>

    </div>



    <!-- ============================= -->
    <!-- Dock -->
    <!-- ============================= -->

    <div class="dock">

        <!-- Start -->

        <div
            class="dock-icon"
            id="start-button"
            title="Start">

            &#xE80F;

        </div>



        <!-- Terminal -->

        <div
            class="dock-icon app-button"
            id="terminal-button"
            data-app="terminal"
            title="Terminal">

            &#xE756;

        </div>



        <!-- Settings -->

        <div
            class="dock-icon app-button"
            id="settings-button"
            data-app="settings"
            title="Settings">

            &#xE713;

        </div>



        <div class="dock-separator"></div>



        <!-- Welcome -->

        <div
            class="dock-app app-button"
            id="welcome-button"
            data-app="welcome">

            &#9881; Welcome

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
