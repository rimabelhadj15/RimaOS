<div class="settings-app">

    <h2>⚙️ Settings</h2>

    <div class="settings-section">

        <h3>Appearance</h3>

        <p>Choose your wallpaper</p>

        <div class="wallpapers">

            <button
                class="wallpaper-option"
                data-wall="current">
                Default
            </button>

            <button
                class="wallpaper-option"
                data-wall="black">
                Black
            </button>

            <button
                class="wallpaper-option"
                data-wall="blue">
                Blue
            </button>

            <button
                class="wallpaper-option"
                data-wall="green">
                Dark Green
            </button>

            <button
                class="wallpaper-option"
                data-wall="purple">
                Purple
            </button>

        </div>
        

    </div>
    

    <div class="settings-section">

        <h3>Terminal</h3>

        <div class="setting-row">

            <span>Terminal text color</span>

            <input
                type="color"
                id="terminal-color"
                value="#00ff88">

        </div>

    </div>


    <div class="settings-section">

        <h3>Clock</h3>

        <div class="setting-row">

            <span>Time format</span>

            <select id="time-format">

                <option value="24">
                    24-hour
                </option>

                <option value="12">
                    12-hour
                </option>

            </select>

        </div>

    </div>

    <div class="settings-section">

        <h3>About RimaOS</h3>

        <p>RimaOS v1.0</p>

        <p>
            Built with HTML, CSS and JavaScript
        </p>

    </div>

</div>
